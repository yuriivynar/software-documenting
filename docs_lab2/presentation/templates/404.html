{% extends "base.html" %}
{% block title %}Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-lg-6">
        <div class="card text-center">
            <div class="card-body py-5">
                <i class="bi bi-exclamation-octagon display-3 text-danger"></i>
                <h1 class="h3 mt-3">Resource not found</h1>
                <p class="text-muted mb-4">{{ message or "The requested resource does not exist." }}</p>
                <a href="/" class="btn btn-primary">Back to dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
